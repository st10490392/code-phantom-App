name: Build Android debug APK

# Manual only — this builds a DEBUG APK pointed at a developer-supplied
# backend URL (typically a LAN address for a local dev machine), so it
# should never run on push/PR.
on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: >-
          Backend base URL the app talks to in this build, e.g.
          http://192.168.176.96:8080/api/v1 (your dev machine's LAN IP).
          Never committed to source — provided fresh on each run.
        required: true
        type: string

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Pinned to the same stable Flutter version this project currently
      # develops against — bump this alongside any local Flutter upgrade.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true

      # ubuntu-latest GitHub-hosted runners ship with the Android SDK
      # preinstalled (ANDROID_HOME/ANDROID_SDK_ROOT already set), so no
      # separate Android SDK setup step is needed here.

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test

      - name: flutter build apk --debug
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
        run: |
          flutter build apk --debug \
            --dart-define=APP_ENV=development \
            --dart-define=API_BASE_URL="$API_BASE_URL"

      - uses: actions/upload-artifact@v4
        with:
          name: CodePhantom-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
