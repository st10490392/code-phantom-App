name: Build Web Staging

# Builds the CodePhantom web app (Flutter web / PWA) against the staging
# backend exactly as the Railway web service does (deploy/web/Dockerfile),
# and uploads it as an artifact. Deployment itself happens on Railway when
# the web service's watched branch changes (docs/WEB.md). Only public
# configuration is used; no secrets are available to this workflow.

on:
  workflow_dispatch:
    inputs:
      enkidu_shadow_view:
        description: "Include owner-only ENKIDU V5 SHADOW view in this staging artifact"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - codephantom-app-dev-qn0faw
    paths:
      - "lib/**"
      - "web/**"
      - "assets/**"
      - "deploy/web/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-web-staging.yml"

permissions:
  contents: read

concurrency:
  group: build-web-staging-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: staging
  API_BASE_URL: https://code-phantom-backend-staging.up.railway.app/api/v1

jobs:
  build:
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: node --test scripts/test_web_push.cjs

      - name: Generate optional Firebase Web worker
        if: vars.PUSH_WEB_ENABLED == 'true'
        env:
          PUSH_FIREBASE_PROJECT_ID: codephantom-technologies
          PUSH_FIREBASE_APP_ID: ${{ vars.PUSH_FIREBASE_WEB_APP_ID }}
          PUSH_FIREBASE_API_KEY: ${{ vars.PUSH_FIREBASE_WEB_API_KEY }}
          PUSH_FIREBASE_SENDER_ID: ${{ vars.PUSH_FIREBASE_SENDER_ID }}
          PUSH_WEB_VAPID_KEY: ${{ vars.PUSH_WEB_VAPID_KEY }}
        run: python3 scripts/firebase_web_config.py

      - name: Check public build configuration
        run: sh deploy/web/check_build_config.sh

      - name: Build staging web app
        run: >-
          flutter build web --release --no-web-resources-cdn
          --dart-define=APP_ENV=${{ env.APP_ENV }}
          --dart-define=ENKIDU_SHADOW_VIEW_ENABLED=${{ github.event_name == 'workflow_dispatch' && inputs.enkidu_shadow_view || false }}
          --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
          --dart-define=PUSH_ENABLED=${{ vars.PUSH_WEB_ENABLED == 'true' }}
          --dart-define=PUSH_FIREBASE_PROJECT_ID=codephantom-technologies
          --dart-define=PUSH_FIREBASE_APP_ID=${{ vars.PUSH_FIREBASE_WEB_APP_ID }}
          --dart-define=PUSH_FIREBASE_API_KEY=${{ vars.PUSH_FIREBASE_WEB_API_KEY }}
          --dart-define=PUSH_FIREBASE_SENDER_ID=${{ vars.PUSH_FIREBASE_SENDER_ID }}
          --dart-define=PUSH_WEB_VAPID_KEY=${{ vars.PUSH_WEB_VAPID_KEY }}

      - name: No source maps in the published bundle
        run: |
          find build/web -name '*.map' -delete
          test -z "$(find build/web -name '*.map')"

      - uses: actions/upload-artifact@v4
        with:
          name: codephantom-web-staging
          path: build/web
          if-no-files-found: error
          retention-days: 7
