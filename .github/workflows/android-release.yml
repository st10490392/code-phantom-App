name: Android release

# Builds a SIGNED Android App Bundle (Play Store) and APK for one
# environment. Signing material and per-environment settings come from
# GitHub Environments ("staging", "production") - nothing secret is in the
# repository or in the built app beyond the public API base URL.
#
# Required per Environment (Settings -> Environments -> <name>):
#   secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#   vars:    API_BASE_URL   (e.g. https://api-staging.example.com/api/v1)
# Recommended: protect "production" with required reviewers.
# See docs/RELEASE_ANDROID.md.

on:
  workflow_dispatch:
    inputs:
      build_name:
        description: "Version name (e.g. 0.2.0). Empty = pubspec version."
        required: false
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write   # only used to attach artifacts to a GitHub Release on tag builds

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Production is tag-only; manual runs are staging-only. This prevents
    # accidental production APKs even when environment reviewers are unavailable.
    environment: ${{ github.event_name == 'push' && 'production' || 'staging' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check release configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PW" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PW" ] || missing="$missing ANDROID_KEY_PASSWORD"
          [ -n "$API_BASE_URL" ] || missing="$missing API_BASE_URL(var)"
          if [ -n "$missing" ]; then
            echo "::error::Release configuration incomplete for this environment:$missing (see docs/RELEASE_ANDROID.md)"
            exit 1
          fi
          case "$API_BASE_URL" in
            https://*) ;;
            *) echo "::error::API_BASE_URL must be https://"; exit 1 ;;
          esac

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install signing key (runner-local, deleted at job end)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter test

      - name: Build signed AAB + APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          BUILD_NAME: ${{ github.event_name == 'push' && github.ref_name || inputs.build_name }}
        run: |
          name_arg=""
          if [ -n "$BUILD_NAME" ]; then name_arg="--build-name=${BUILD_NAME#v}"; fi
          # APP_ENV=production selects the real ApiAuthService path; the
          # environment (staging vs production) is decided by API_BASE_URL.
          common="--release --obfuscate --split-debug-info=build/debug-info \
            --build-number=${{ github.run_number }} $name_arg \
            --dart-define=APP_ENV=production --dart-define=API_BASE_URL=$API_BASE_URL"
          flutter build appbundle $common
          flutter build apk $common

      - name: Refuse unsigned or debug-signed output
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          if [ -z "$apksigner" ]; then
            echo "::error::Android apksigner was not found in the SDK"; exit 1
          fi

          verify_output=$("$apksigner" verify --verbose --print-certs "$apk" 2>&1) || {
            echo "$verify_output"
            echo "::error::Release APK signature verification failed"; exit 1
          }
          echo "$verify_output"

          signer_dn=$(printf '%s\n' "$verify_output" | sed -n 's/^Signer #1 certificate DN: //p' | head -n 1)
          echo "APK signer: $signer_dn"
          if [ -z "$signer_dn" ]; then
            echo "::error::Release APK signer certificate was not found"; exit 1
          fi
          if echo "$signer_dn" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK is debug-signed"; exit 1
          fi

          sha256sum build/app/outputs/bundle/release/app-release.aab "$apk" | tee SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: codephantom-android-${{ github.event_name == 'push' && 'production' || 'staging' }}-${{ github.run_number }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            SHA256SUMS.txt
          retention-days: 30

      # Obfuscation symbols are needed to de-obfuscate crash stack traces.
      # Kept as a private workflow artifact - never attached to a public release.
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols-${{ github.run_number }}
          path: build/debug-info
          retention-days: 90

      - name: Attach to GitHub Release (tag builds)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" >/dev/null 2>&1 \
            || gh release create "${{ github.ref_name }}" --draft --title "${{ github.ref_name }}" --notes "Android build ${{ github.run_number }}"
          gh release upload "${{ github.ref_name }}" \
            build/app/outputs/bundle/release/app-release.aab \
            build/app/outputs/flutter-apk/app-release.apk SHA256SUMS.txt --clobber
