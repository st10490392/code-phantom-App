name: Build Antagonistic Trader Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/antagonistic-trader-at001
    paths:
      - "lib/antagonistic/**"
      - "lib/main_antagonistic.dart"
      - "android/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-antagonistic-debug.yml"

permissions:
  contents: read

concurrency:
  group: antagonistic-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test shared platform
        run: flutter test

      - name: Build Antagonistic Trader APK
        run: >-
          flutter build apk --debug
          --flavor antagonistic
          -t lib/main_antagonistic.dart

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: antagonistic-trader-at001-debug-apk
          path: build/app/outputs/flutter-apk/app-antagonistic-debug.apk
          if-no-files-found: error
          retention-days: 7
