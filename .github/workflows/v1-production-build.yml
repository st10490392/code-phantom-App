name: CodePhantom v1 production build

on:
  push:
    branches:
      - release/v1.0.0-production

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.5"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Reuse the verified release-signing key already stored in the staging
    # GitHub Environment. The compiled app itself is still a production build.
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Check production release configuration
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$STORE_PW" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PW" ] || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release signing configuration incomplete:$missing"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install release signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          echo "$KEYSTORE" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PW"
          } > android/key.properties

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build signed production AAB + APK
        env:
          API_BASE_URL: https://code-phantom-backend-staging.up.railway.app/api/v1
        run: |
          common="--release --obfuscate --split-debug-info=build/debug-info \
            --build-name=1.0.0 --build-number=${{ github.run_number }} \
            --dart-define=APP_ENV=production --dart-define=API_BASE_URL=$API_BASE_URL"
          flutter build appbundle $common
          flutter build apk $common

      - name: Verify release signature and hashes
        run: |
          apk=build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          [ -n "$apksigner" ] || { echo "::error::apksigner not found"; exit 1; }
          verify_output=$("$apksigner" verify --verbose --print-certs "$apk" 2>&1) || {
            echo "$verify_output"
            echo "::error::Release APK signature verification failed"
            exit 1
          }
          echo "$verify_output"
          signer_dn=$(printf '%s\n' "$verify_output" | sed -n 's/^.*certificate DN: //p' | head -n 1)
          [ -n "$signer_dn" ] || { echo "::error::Signer certificate not found"; exit 1; }
          if echo "$signer_dn" | grep -qi "CN=Android Debug"; then
            echo "::error::Production APK is debug-signed"
            exit 1
          fi
          sha256sum build/app/outputs/bundle/release/app-release.aab "$apk" | tee SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties android/app/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: CodePhantom-v1.0.0-production
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
            SHA256SUMS.txt
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: CodePhantom-v1.0.0-debug-symbols
          path: build/debug-info
          retention-days: 90
