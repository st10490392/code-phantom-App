name: Build Android Staging APK

on:
  workflow_dispatch:
  push:
    branches:
      - codephantom-app-dev-qn0faw
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - ".github/workflows/build-android-staging.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build real-backend staging APK
        run: >-
          flutter build apk --debug
          --flavor codephantom
          -t lib/main.dart
          --dart-define=APP_ENV=staging
          --dart-define=API_BASE_URL=https://code-phantom-backend-staging.up.railway.app/api/v1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codephantom-staging-real-backend-apk
          path: build/app/outputs/flutter-apk/app-codephantom-debug.apk
          if-no-files-found: error
          retention-days: 7
