# Conservative defaults for a normal Flutter/Android Gradle build — the
# previous -Xmx8G/-XX:MaxMetaspaceSize=4G asked for 12G of JVM heap+metaspace
# alone, which is unreasonable on an ordinary developer machine (and was
# never shown to be necessary for this project; no performance claim is
# made here beyond "this is the commonly recommended range for a project
# this size"). Also used unchanged by the GitHub Actions debug-APK build.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
