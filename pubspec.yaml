name: code_phantom_app
description: >
  CodePhantom Technologies mobile platform — scanner, signals, EA monitoring,
  client & licence administration. Phase 1: mock services behind clean
  interfaces; UI/UX and architecture only.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Design system
  cupertino_icons: ^1.0.8

  # Storage (tokens must never sit in plain shared_preferences)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Formatting
  intl: ^0.19.0

  # Networking (real CodePhantom backend, starting with auth in this
  # milestone). Chosen over the bare `http` package because the app needs
  # per-request Authorization header injection, connect/receive timeouts,
  # and a custom HttpClientAdapter for tests (fake transport, no real
  # network) — dio supports all three natively; `http` would need a hand
  # -rolled wrapper for the same behavior. Widely maintained, ~3M+ pub
  # points, used by the majority of production Flutter apps that talk to a
  # REST backend.
  dio: ^5.7.0
  package_info_plus: ^9.0.1

  # Opens provider-hosted checkout outside the app so payment credentials
  # never touch CodePhantom's Flutter process.
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

  # Launcher icon generation only (dev-time tool, not shipped in the app).
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  # Bundled locally instead of fetched at runtime via `google_fonts` — see
  # `core/theme/app_typography.dart`'s class doc for why. Only the weights
  # the app actually uses are included.
  fonts:
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

# Generates android/ + ios/ launcher icons from the official CodePhantom
# mark. `assets/brand/icon_foreground.png` is the same mark shrunk to 66%
# and centered on a transparent canvas so Android's adaptive-icon mask
# (circle/squircle/rounded-square) never clips the emblem; the flat
# `image_path` (full-bleed mark) is used for iOS and legacy Android icons,
# which aren't safe-zone-masked the same way. Regenerate with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/brand/mark.png"
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#05070D"
  adaptive_icon_background: "#05070D"
  adaptive_icon_foreground: "assets/brand/icon_foreground.png"
  min_sdk_android: 21
