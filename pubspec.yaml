name: code_phantom_app
description: >
  CodePhantom Technologies mobile platform — scanner, signals, EA monitoring,
  client & licence administration. Phase 1: mock services behind clean
  interfaces; UI/UX and architecture only.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Design system
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

  # Storage (tokens must never sit in plain shared_preferences)
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  # Formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
